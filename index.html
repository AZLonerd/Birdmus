<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birdmus</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background: #111;
            color: white;
            position: relative
        }

        .upload-select {
            width: 120px;
            height: 120px;
            border: 2px dashed #6cf2ff;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 20px;
            background:
                radial-gradient(circle at top, rgba(83, 168, 255, 0.22), transparent 60%),
                linear-gradient(145deg, rgba(8, 18, 40, 0.88), rgba(20, 10, 42, 0.92));
            box-shadow:
                0 0 18px rgba(108, 242, 255, 0.28),
                inset 0 0 18px rgba(108, 242, 255, 0.1);
        }


        .upload-result {
            margin-top: 10px;
            width: 30%;

        }

        canvas {
            width: 100%;
            height: 400px;
            background: black;
            display: none;
        }

        audio {
            display: none;
        }

        #playBtn {
            padding: 10px 20px;
            font-size: 18px;
            background: linear-gradient(135deg, #64f7ff, #6b8dff);
            color: #07111f;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            font-weight: 800;
            box-shadow: 0 0 18px rgba(100, 247, 255, 0.45);
        }

        .progress-bar {
            width: 100%;
            height: 15%;
            background-color: rgba(141, 163, 196, 0.25);
            border-radius: 10%;
            border: 1px solid rgba(108, 242, 255, 0.35);
            overflow: hidden;
        }

        .bar {
            width: 5%;
            height: 100%;
            background: linear-gradient(90deg, #59f1ff, #ac7cff);
            animation-name: bar;
            animation-iteration-count: 1;
            animation-duration: 5s;
            animation-fill-mode: forwards;
        }

        @keyframes bar {
            to {
                width: 100%;
            }
        }

        .music-progress-bar {
            position: relative;
            height: 50px;
            width: 20vw;
            background:
                radial-gradient(circle at top left, rgba(108, 242, 255, 0.22), transparent 55%),
                linear-gradient(135deg, rgba(8, 18, 40, 0.94), rgba(28, 12, 50, 0.92));
            border: 1px solid rgba(108, 242, 255, 0.45);
            border-radius: 16px;
            overflow: hidden;
            box-shadow:
                0 0 18px rgba(108, 242, 255, 0.22),
                inset 0 0 16px rgba(108, 242, 255, 0.08);
        }

        .percentage {
            --percent-value: 0%;
            position: absolute;
            height: 100%;
            width: var(--percent-value);
            background: linear-gradient(90deg, #59f1ff, #8b7dff);
            box-shadow:
                0 0 14px rgba(89, 241, 255, 0.35),
                inset 0 0 10px rgba(255, 255, 255, 0.15);
        }

        #HomepageBtn {
            width: 200px;
            height: 40px;
            background: linear-gradient(135deg, rgba(9, 20, 45, 0.95), rgba(30, 12, 54, 0.92));
            transition: 0.3s;
            font-weight: 800;
            color: #8ef7ff;
            border: 1px solid rgba(142, 247, 255, 0.6);
            border-radius: 12px;
            box-shadow: 0 0 18px rgba(108, 242, 255, 0.22);
        }

        #HomepageBtn:hover {
            cursor: pointer;
            background: linear-gradient(135deg, rgba(18, 36, 72, 0.98), rgba(51, 21, 84, 0.95));
            color: #ffd56a;
        }


        .finish-page {
            position: fixed;
            top: -30%;

            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            background:
                radial-gradient(circle at top, rgba(102, 208, 255, 0.18), transparent 55%),
                linear-gradient(160deg, rgba(7, 14, 30, 0.97), rgba(24, 12, 46, 0.96));
            color: #fff;
            padding: 2rem;
            border-radius: 20px;
            border: 1px solid rgba(108, 242, 255, 0.45);
            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.5),
                0 0 28px rgba(108, 242, 255, 0.2);
            text-align: center;
            display: none;

            animation: finishpageanimation 0.6s forwards;
        }


        .finish-page p {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }


        .finish-page button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #5cf0ff, #7b86ff);
            border: none;
            border-radius: 8px;
            color: #08101b;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin: auto;
            display: block;
            box-shadow: 0 0 16px rgba(92, 240, 255, 0.35);
        }

        .finish-page button:hover {
            background: linear-gradient(135deg, #8df6ff, #ac7cff);
            transform: translateY(-2px);
        }

        /* Animation (slide down only) */
        @keyframes finishpageanimation {
            from {
                top: -30%;
                opacity: 0;
            }

            to {
                top: 20%;
                opacity: 1;
            }
        }

        .tutorialbtn {
            width: 120px;
            height: 50px;
            color: #8ef7ff;
            background: linear-gradient(135deg, rgba(10, 22, 45, 0.96), rgba(32, 12, 58, 0.95));
            font-weight: 800;
            border: 1px solid rgba(142, 247, 255, 0.5);
            border-radius: 14px;
            box-shadow: 0 0 18px rgba(108, 242, 255, 0.2);

        }

        .tutorialbtn:hover {
            cursor: pointer;
            color: #ffd56a;
            background: linear-gradient(135deg, rgba(18, 36, 72, 0.98), rgba(58, 19, 82, 0.96));
            font-weight: 800;

        }

        .exclaimation {
            display: inline-block;
            color: red;
            margin-right: 10px;
            animation: swing 2s infinite ease-in-out;

        }

        .mustbe {
            color: white;
            font-weight: 600;
            margin: auto;
            width: fit-content;
        }

        @keyframes swing {
            0% {
                transform: rotate(15deg);
            }

            50% {
                transform: rotate(-15deg);
            }

            100% {
                transform: rotate(15deg);
            }
        }

        .gameover .container {
            display: block;
        }


        .pointsdiv {
            display: none;
            position: absolute;
            left: 55%;
            top: 0%;
            width: 40%;
        }

        .defaultaudiocontainer {
            font-family: sans-serif;
            margin: auto;
            padding: 16px;
            border-radius: 12px;
            max-width: 400px;
        }

        .song-container {
            margin: auto;
            width: fit-content;
            margin-top: 10px;
        }

        .defaultaudiocontainer button {
            width: 300px;
            height: auto;
            border-radius: 12px;
            font-weight: 700;
            font-size: 20px;
            margin-top: 10px;
            background: #1e1e1e;
            color: #f5f5f5;
        }

        .defaultaudiocontainer button:hover {
            cursor: pointer;
            width: 300px;
            height: auto;
            border-radius: 12px;
            font-weight: 700;
            font-size: 20px;
            background-color: #2a2a2a;
        }



        .song-instruction {
            font-size: 15px;
            font-weight: 800;
            margin: auto;
            width: fit-content
        }

        .dance-with-me,
        .champagne-ocean {
            display: flex;
            align-items: center;
            justify-content: flex-start;

            gap: 8px;
        }

        .dancewithmeicon::before,
        .champagneoceanicon::before {
            content: "▶️";
            position: static;

        }


        .yellowsquare {
            display: inline-block;
            width: 20px;
            height: 20px;
            background-color: yellow;
        }

        .game-btn {
            background: linear-gradient(135deg, rgba(8, 18, 40, 0.95), rgba(34, 13, 62, 0.94));
            color: #ffe37b;
            border: 2px solid #71f0ff;
            border-radius: 12px;
            margin-left: 10px;
            padding: 10px 10px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            position: relative;
            box-shadow: 0 0 16px rgba(108, 242, 255, 0.24);
        }

        .game-btn::after {
            content: "What's the Hotkey?";
        }

        .game-btn:hover::after {
            content: "WASD for movement"
        }


        .btntoreducecount {
            position: fixed;
            left: 47%;
            transform: translateY(-50%);

            width: 100px;
            height: 50px;
            display: none;


            background: radial-gradient(circle at 30% 30%, #1a1a2e, #0f0f1f);
            color: #fff;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;

            border: 2px solid #00f0ff;

            border-radius: 12px;
            box-shadow: 0 0 15px #00f0ff, 0 0 30px #00f0ff, 0 0 45px #ff00ff;

            cursor: pointer;
            transition: all 0.2s ease-in-out;

            /* Pulsing animation */
            animation: pulse 1s infinite ease-in-out;
        }

        /* Animation keyframes */
        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 15px #00f0ff, 0 0 30px #00f0ff, 0 0 45px #ff00ff;
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 0 25px #00f0ff, 0 0 50px #ff00ff, 0 0 75px #00ffea;
            }

            100% {
                transform: scale(1);

                box-shadow: 0 0 15px #00f0ff, 0 0 30px #00f0ff, 0 0 45px #ff00ff;
            }
        }

        .btntoreducecount:hover {
            transform: scale(1.05);

            box-shadow: 0 0 30px #00f0ff, 0 0 60px #ff00ff, 0 0 90px #00ffea;
        }

        .btntoreducecount:active {
            transform: scale(1.1);
            box-shadow: 0 0 15px #00f0ff, 0 0 30px #ff00ff;
        }

        .numneedtoclick {
            position: fixed;
            top: 1%;
            left: 50%;
            transform: translateX(-50%);

            width: 5vw;
            padding: 12px 22px;

            font-size: 2vw;
            font-weight: 800;
            letter-spacing: 2px;
            text-align: center;
            color: #00f6ff;

            background: radial-gradient(circle at top, #0b1d3a, #040812);
            border: 2px solid #00f6ff;
            border-radius: 14px;

            box-shadow:
                0 0 10px #00f6ff,
                0 0 25px rgba(0, 246, 255, 0.6),
                inset 0 0 12px rgba(0, 246, 255, 0.4);

            text-shadow:
                0 0 6px #00f6ff,
                0 0 12px #00f6ff;

            user-select: none;
            pointer-events: none;
            z-index: 999;
        }

        .tp-meter {
            position: fixed;
            top: 10px;
            left: 15%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            /* vertically center items */
            gap: 10px;
        }

        .teleporttext {
            font-family: "Orbitron", "Trebuchet MS", sans-serif;
            font-size: 16px;
            font-weight: bold;
            color: #00f6ff;
            letter-spacing: 1px;
            padding: 4px 8px;
            margin: 0;

            text-shadow:
                0 0 4px #00f6ff,
                0 0 8px rgba(0, 246, 255, 0.6),
                0 0 12px rgba(0, 246, 255, 0.4);

            transition: 0.2s ease;
            user-select: none;
        }

        .tp-segment {
            width: 55px;
            height: 14px;
            border-radius: 20px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #8be9ff;
            box-shadow: inset 0 0 6px rgba(139, 233, 255, 0.4);

            opacity: 0.25;
            transition: 0.2s ease;
        }

        .tp-segment.active {
            opacity: 1;
            background: linear-gradient(90deg, #00f6ff, #00ffd5);
            box-shadow:
                0 0 8px #00f6ff,
                0 0 18px rgba(0, 246, 255, 0.8);
        }


        .pointsp {
            display: flex;
            align-items: center;
            gap: 22px;


            margin: 10px 0;
            padding: 12px 12px;

            background: linear-gradient(145deg, rgba(5, 10, 30, 0.9), rgba(10, 20, 60, 0.85));
            border: 2px solid rgba(120, 180, 255, 0.6);
            border-radius: 14px;

            box-shadow:
                0 0 12px rgba(120, 180, 255, 0.4),
                inset 0 0 12px rgba(120, 180, 255, 0.2);

            font-family: "Orbitron", "Trebuchet MS", sans-serif;
            font-size: 16px;
            color: white;
            letter-spacing: 1px;
            user-select: none;
        }


        .pointsp .pointspan {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffe37b;
            text-shadow: 0 0 10px rgba(255, 227, 123, 0.9);
        }


        .pointsp .bluepointsspan {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4dc3ff;
            text-shadow: 0 0 10px rgba(77, 195, 255, 0.9);
        }

        .pointsp {
            animation: hudGlow 3s ease-in-out infinite alternate;
        }

        @keyframes hudGlow {
            from {
                box-shadow: 0 0 10px rgba(120, 180, 255, 0.3),
                    inset 0 0 10px rgba(120, 180, 255, 0.15);
            }

            to {
                box-shadow: 0 0 22px rgba(120, 180, 255, 0.7),
                    inset 0 0 14px rgba(120, 180, 255, 0.25);
            }
        }

        .teleporttext {

            font-family: "Orbitron", "Trebuchet MS", sans-serif;
            font-size: 16px;
            font-weight: bold;
            color: #00f6ff;
            letter-spacing: 1px;
            margin-right: 8px;



            transition: 0.2s ease;
            padding-top: 30px;
            user-select: none;
            margin-bottom: 30px;
        }

        .leftbtn,
        .rightbtn {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            background: linear-gradient(135deg, rgba(11, 23, 46, 0.98), rgba(36, 14, 64, 0.96));
            border: 1px solid rgba(108, 242, 255, 0.45);
            color: #dcefff;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(108, 242, 255, 0.18);
        }

        .leftbtn::before {
            content: "◀";
        }

        .rightbtn::before {
            content: "▶";
        }

        .leftbtn:hover,
        .rightbtn:hover {
            background: linear-gradient(135deg, rgba(23, 44, 83, 0.98), rgba(63, 21, 93, 0.96));
        }

        .leftbtn:active,
        .rightbtn:active {
            background: linear-gradient(135deg, rgba(7, 17, 35, 0.98), rgba(26, 9, 45, 0.96));
        }


        .slide-btn {
            display: block;
        }


        @media (max-width: 1200px) {


            .gamewincheckcontainer {
                font-size: 12px;
            }


            .pointsp {
                font-size: 12px;
                gap: 1px;
            }

            .tutorial-wrapper {
                position: absolute;
                bottom: -300px;
                left: 50%;

                transform: translateX(-50%);
                z-index: 999;
                width: fit-content;
            }


            .tutorial-container {
                left: 0 !important;
                top: 0 !important;
            }

            .container2 {
                left: -35px !important;
            }



            #homepagebtn {
                width: 20vw;
            }



            .tutorial.active {
                display: block;
            }

            .leftbtncontainer {
                display: none;
            }

            .rightbtncontainer {
                display: none;
            }


        }

        @media(max-width:800px) {
            .blueyellowpointsdiv {
                white-space: normal !important;

            }

            .gamewincheckcontainer {
                width: 250px;
                font-size: 10px;
            }

            #HomepageBtn {
                width: 30vw !important;
            }


            .pause-container,
            .resume-icon {
                right: 20vw;
            }

            .numneedtoclick {
                top: 21%;
                width: 3vw;
            }



        }

        @media(max-width:600px) {


            .gamewincheckcontainer {
                width: 220px;

            }

            .pause-container {
                margin-right: 10vw;
            }

            .resume-icon {
                margin-right: 10vw;
            }

            .numneedtoclick {
                top: 19%;
                width: 3vw;
            }

        }

        @media(max-width: 400px) {
            .numneedtoclick {
                top: 22%;
                width: 3vw;
            }
        }


        .topbar {
            margin-left: 10%;
        }
    </style>

    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="stylesheet" href="upload.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="pointsdiv">
        <div class="topbar" style="display: flex; margin-right: 10vw; ">
            <div class="tp-meter" id="tpMeter" style="width: 30%; ">
                <p class="teleporttext">Teleport:</p>
                <div class="tp-segment"></div>
                <div class="tp-segment"></div>
                <div class="tp-segment"></div>
                <div class="tp-segment"></div>
                <div class="tp-segment"></div>
            </div>
            <div class="blueyellowpointsdiv" style; margin-top: 0%; white-space: nowrap;">
                <p class="pointsp" style="width: fit-content;">
                    <span>
                        Total yellow points:
                        <span class="pointspan">0</span>
                    </span>

                    <span>
                        Total blue points:
                        <span class="bluepointsspan">0</span>
                    </span>
                </p>
            </div>

        </div>

        <div class="gamewincheckcontainer" style="color: red; margin-top: 0%; display: flex;  gap: 20px;">

            <div style="display: flex; align-items: center; gap: 6px;">
                <span class="cross">❌</span>
                <span class="ifpassedcheck">
                    you need <span class="pointsneeded">0</span> yellow points to pass
                </span>
            </div>

            <div class="bluepointsneededcheck" style="display: flex; align-items: center; gap: 6px;">
                <span class="cross2">❌</span>
                <span class="ifpassedcheck">
                    you need <span class="bluepointsneededspan">0</span> blue points to pass
                </span>
            </div>

        </div>

    </div>
    <div class=" upload select">
        <div class="upload-select" id="uploadBox" style="margin:auto">
            <p class="plus-icon">+</p>
            <input class="inputbox" type="file" accept=".mp3,audio/*" hidden />
            <div class="progress-bar" style="display:none">
                <div class="bar"></div>
                <p>loading</p>
            </div>
        </div>

        <div class="introduction"
            style="margin:auto; width:fit-content;margin-top: 50px; font-weight: 800; font-size: 15px;">
            upload your
            favorite
            music to
            get started</div>
        <div class="mustbe">⚠️Warning:must be .mp3 file</div>

        <div class="tutorial-wrapper" style="position: relative;">
            <div class="tutorial-container" style="width:fit-content; position: relative; left:80%; top:-100px; ">
                <button class="tutorialbtn"><span class="exclaimation">!!</span>tutorial</button>
                <div class="tutorial" style="display: none;">

                    <div class="container2" style="width: 200px; right: -2.5vw">
                        <div class="allslide">
                            <div class="slide">
                                <img src="uploadmusic.PNG" width="200px" height="200px" />
                            </div>
                            <div class="slide">
                                <img src="wasdfor.PNG" width="200px" height="200px" />
                            </div>
                            <div class="slide">
                                <img src="dodgesound4.PNG" width="200px" height="200px" />
                            </div>
                            <div class="slide">
                                <img src="contacting yellow.PNG" width="200px" height="200px" />
                            </div>
                            <div class="slide">
                                <img src="bluepoints2.PNG" width="200px" height="200px" />
                            </div>
                            <div class="slide">
                                <img src="tpinstructionfinal.PNG" width="200px" height="200px" />
                            </div>

                        </div>

                        <div class="indicator">
                            <span class="active"></span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>

                    </div>
                </div>
            </div>

            <div class="leftbtncontainer" style="position: absolute; right:22.4vw; top:49%">
                <button class="slide-btn leftbtn" style="visibility: hidden;"></button>
            </div>
            <div class="rightbtncontainer" style="position: absolute; right:6.2vw; top: 49%">
                <button class="slide-btn rightbtn" style="visibility: hidden;"></button>
            </div>

        </div>

        <div class="defaultaudiocontainer" style="margin-top: 20px;">
            <p class="song-instruction">Don't got songs? Use some of the songs here</p>
            <div style="height:auto;" class="song-container">
                <div style="height: auto;">
                    <audio class="default-audio" src=""></audio>
                    <button class="champagne-ocean">
                        <p class="champagneoceanicon">Ehrling-Champagne Ocean</p>
                    </button>
                </div>
                <div class="song two" style="height:auto">
                    <audio class="default-audio-two" src=""></audio>
                    <button class="dance-with-me">
                        <p class="dancewithmeicon">Ehrling-dance with me</p>
                    </button>
                </div>
            </div>

        </div>

        <div class="upload-result"></div>


        <div style="position: relative;width: 5vw; height: 1px; margin-left: 75vw ">
            <div style="display:none;  position: absolute; right:0; top:1.5vh" class="pause-container">
                <div class="pause-icon" style="">
                    <i class="fa-solid fa-pause"></i>
                </div>

            </div>

            <div style="display: none; position: absolute; right: 0; top:1.5vh" class="resume-icon">

                <div style="">
                    <i class="fa-solid fa-play "></i>
                </div>

            </div>
        </div>




    </div>

    <div class="gameover" style="display:none; height:auto; margin-top:15vh">

        <div class="container" style="padding: 1px;">
            <h2 class="gameover-text">Game over</h2>
            <p style="margin-top: 80px" class="percentdone"></p>
            <button id="restart-game" style="width: 90%">Restart game</button>
        </div>

    </div>

    <div class="pause-page" style="margin-top: 15vh">

        <div class="pause-page-instruction">
            <p>you paused the game</p>
        </div>
        <div class="button-container" style="display: block;">
            <div class="pausebtn">
                <button class="pause-restartbtn" id="restart-game3">Restart game</button>
            </div>


            <div class="pausebtn">
                <button class="resume-gamebtn">Resume game</button>
            </div>

        </div>

    </div>


    <div class="finish-page" style="display: none; margin-top: 15vh ">
        <p class="finish-page-p"></p>
        <div style="display:flex">
            <button id="restart-game2">Restart game</button>
        </div>

    </div>

    <canvas style="margin-top: 9vh;">

    </canvas>

    <audio></audio>
    <!-- music play progress bar -->

    <div class="containerforcanvaspage">
        <div><button id="playBtn">▶️ Play Music</button></div>
        <div class="progress-container" style="display: flex;">
            <div style="display: none;" class="music-progress-bar">
                <div class="percentage"></div>
            </div>
            <div class="progress-bar-finish" style="display: none;user-select: none;">Finish</div>

        function random(min, max) {

        function lerp(a, b, t) {
            return a + (b - a) * t;

        class Point {
            constructor() {
                this.r = 4;
                this.x = random(100, canvas.width - 100);
                this.y = random(100, canvas.height - 200);
                this.tx = this.x;
                this.ty = this.y;
            }

            update() {
                this.x = lerp(this.x, this.tx, 0.005);
                this.y = lerp(this.y, this.ty, 0.005);
                const dx = this.tx - this.x;
                const dy = this.ty - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 1) {
                    const range = 40;
                    this.tx = this.x + random(-range, range);
                    this.ty = this.y + random(-range, range);
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, 2 * Math.PI);
                ctx.fillStyle = "white";
                ctx.fill();
            }
        }

        class Graph {
            constructor(count = 60) {
                this.points = new Array(count).fill(0).map(() => new Point());
            }

            update() {
                this.points.forEach(p => p.update());
            }

            draw() {
                this.points.forEach(p => p.draw());
            }
        }

        function isCollidingcirrec(circle, rect) {
            const closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.width));
            const closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.height));

            const dx = circle.x - closestX;
            const dy = circle.y - closestY;

            return dx * dx + dy * dy < circle.radius * circle.radius;
        }

        function initBullets(num) {

            for (let i = 0; i < 3; i++) {
                let bullet = {
                    x: 0,
                    y: 0,
                    radius: 15,
                    speedX: 0,
                    speedY: 0
                };

                if (num === 0) {
                    // Left to right
                    bullet.x = 0;
                    bullet.y = randombulletYstarting();
                    bullet.speedX = baseSpeed * delta;
                    bullet.speedY = (i === 0 ? baseDiagSpeed * delta : i === 2 ? -baseDiagSpeed * delta : 0);

                } else if (num === 1) {
                    // Right to left
                    bullet.x = canvas.width - bullet.radius;
                    bullet.y = randombulletYstarting();
                    bullet.speedX = -baseSpeed * delta;
                    bullet.speedY = (i === 0 ? baseDiagSpeed * delta : i === 2 ? -baseDiagSpeed * delta : 0);

                } else if (num === 2) {
                    // Top to bottom
                    bullet.x = randomXstarting();
                    bullet.y = 0;

                    }
                }

                let temp = stage + 1
                if (temp > 4) {
                    stage = 4;
                } else {
                    stage = temp;
                }
            }
            else if (Math.abs(previousmaxvolume - currentmaxvolume) > 15 && currentmaxvolume > previousmaxvolume) {
                let temp = stage + Math.floor(1 + Math.random() * 2)
                if (temp > 4) {
                    stage = 4;
                } else {
                    stage = temp;
                }
            }


            else if (Math.abs(previousmaxvolume - currentmaxvolume) > 15 && currentmaxvolume < previousmaxvolume) {
                let temp = stage - Math.floor(1 + Math.random() * 2)
                if (temp < 0) {
                    stage = 0;
                } else {
                    stage = temp;
                }
            }

            return stage;

        function generatespawnpointbuilder(width, height, forceMiddle = false) {
            return function () {

                const minX = (500 / 1910) * canvas.width;
                const maxX = (canvas.width / 2) + minX;
                const x = Math.floor(Math.random() * (maxX - minX) + minX);

                let y;

                if (forceMiddle) {
                    // perfectly centered
                    y = (canvas.height - height) / 2;
                } else {
                    // near the middle
                    const centerY = canvas.height / 2;
                    const spread = 40;
                    y = Math.floor(Math.random() * (spread * 2) + (centerY - spread));
                }

                return { x, y, width, height };
            }
        }

        function lerpColor(c1, c2, t) {
            return {
                r: c1.r + (c2.r - c1.r) * t,
                g: c1.g + (c2.g - c1.g) * t,
                b: c1.b + (c2.b - c1.b) * t
            };
        }



        function rgbToString(c) {
            return `rgb(${Math.round(c.r)},${Math.round(c.g)},${Math.round(c.b)})`;
        }

        function determinehowmanytimestoclick(number) {
            const currentime = Number(number);

            if (currentime <= 20) {
                return 12
            } else if (currentime > 20 && currentime <= 40) {
                return 10;
            } else if (currentime > 40 && currentime <= 90) {
                return 8;
            } else if (currentime > 90 && currentime <= 140) {
                return 6
            } else {
                return 3;
            }
        }





        function throttle(fn, space) {

            let lasttime = 0;


            return function a(...args) {
                let currenttime = Date.now();
                if (currenttime - lasttime > space) {
                    fn.apply(this, args)
                    lasttime = currenttime
                }

                currenttime = Date.now();
            }
        }
